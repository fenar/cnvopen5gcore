apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: scc-admin
allowPrivilegedContainer: true
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
users:
- system:serviceaccount:open5gcore:scc-admin-sa
- system:serviceaccount:open5gcore:default
- my-admin-user
groups:
- my-admin-group
